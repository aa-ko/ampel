# Taskfile for the ampel repo — https://taskfile.dev
#
# The Cleware USB traffic light and everything that drives it without herdr:
#   cleware/    Rust wrapper around the vendor C++ driver (linked in via build.rs)
#   co2ampel/   CO2 ppm from an MQTT topic on the light
#
#   task                 # this summary + the task list
#   task build           # both crates (release)
#   task test            # all workspace tests
#   task arm             # cross-compile co2ampel for a 64-bit Raspberry Pi
#
#   task co2 -- --host pi --topic buero-nord/co2sensor/co2   # run the CO2 light
#
#   task install-udev    # udev rules for the light (needs sudo)
#   task clean
version: "3"

vars:
  CO2_BIN: target/release/co2ampel
  # Pi 3 and Pi 5 both run 64-bit Raspberry Pi OS, so one target covers both.
  ARM_TARGET: aarch64-unknown-linux-gnu

tasks:
  default:
    desc: Show a short repo summary and list the available tasks
    silent: true
    cmds:
      - |
        echo "ampel — drive a Cleware USB traffic light from Rust."
        echo
        echo "  cleware/    wrapper around the vendor C++ driver (Color, Light, set)"
        echo "  co2ampel/   CO2 ppm via MQTT -> green / yellow / red"
        echo
        echo "  Build everything with: task build"
        echo
      - task --list

  build:
    desc: Build both crates (release); the vendor C++ is compiled by cleware/build.rs
    cmds:
      - cargo build --release

  arm:
    desc: Cross-compile co2ampel for a 64-bit Raspberry Pi (needs cross + docker)
    env:
      # Neutralise host-only ~/.cargo/config.toml settings inside the container
      # (see Cross.toml); sccache and clang/mold do not exist in the image.
      RUSTC_WRAPPER: ""
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
    cmds:
      - cross build --release --target {{.ARM_TARGET}} -p co2ampel
      - 'echo "-> target/{{.ARM_TARGET}}/release/co2ampel"'

  test:
    desc: Run all workspace tests
    cmds:
      - cargo test

  co2:
    desc: 'Run the CO2 light, e.g. task co2 -- --host pi --topic buero-nord/co2sensor/co2'
    deps: [build]
    cmds:
      - "{{.CO2_BIN}} {{.CLI_ARGS}}"

  install-udev:
    desc: Install the udev rule for non-root access to the light (needs sudo)
    cmds:
      - sudo install -m 0644 packaging/99-cleware.rules /etc/udev/rules.d/99-cleware.rules
      - sudo udevadm control --reload-rules
      - sudo udevadm trigger
      - echo "Installed. Re-plug the light for the rule to apply."

  clean:
    desc: Remove build artifacts
    cmds:
      - cargo clean
